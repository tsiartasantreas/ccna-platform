<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0a0f1e"/>
  <text x="400" y="30" font-family="Arial" font-size="20" fill="#00d4ff" text-anchor="middle" font-weight="bold">VLAN & Trunk Topology</text>

  <!-- Switch 1 -->
  <rect x="300" y="60" width="200" height="50" rx="8" fill="#1a2332" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Switch 1</text>

  <!-- Switch 2 -->
  <rect x="300" y="350" width="200" height="50" rx="8" fill="#1a2332" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="380" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Switch 2</text>

  <!-- Trunk Link -->
  <line x1="400" y1="110" x2="400" y2="350" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="420" y="230" font-family="Arial" font-size="12" fill="#f59e0b" font-weight="bold">Trunk</text>
  <text x="420" y="245" font-family="Arial" font-size="10" fill="#94a3b8">802.1Q</text>

  <!-- VLAN 10 - Switch 1 -->
  <rect x="50" y="140" width="100" height="40" rx="6" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
  <text x="100" y="165" font-family="Arial" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">VLAN 10</text>
  <line x1="150" y1="160" x2="300" y2="85" stroke="#00d4ff" stroke-width="1"/>

  <!-- VLAN 20 - Switch 1 -->
  <rect x="50" y="200" width="100" height="40" rx="6" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="1"/>
  <text x="100" y="225" font-family="Arial" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">VLAN 20</text>
  <line x1="150" y1="220" x2="300" y2="85" stroke="#7c3aed" stroke-width="1"/>

  <!-- VLAN 10 - Switch 2 -->
  <rect x="650" y="300" width="100" height="40" rx="6" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
  <text x="700" y="325" font-family="Arial" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">VLAN 10</text>
  <line x1="650" y1="320" x2="500" y2="375" stroke="#00d4ff" stroke-width="1"/>

  <!-- VLAN 20 - Switch 2 -->
  <rect x="650" y="360" width="100" height="40" rx="6" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="1"/>
  <text x="700" y="385" font-family="Arial" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">VLAN 20</text>
  <line x1="650" y1="380" x2="500" y2="375" stroke="#7c3aed" stroke-width="1"/>

  <!-- PCs -->
  <rect x="50" y="260" width="80" height="30" rx="4" fill="#1a2332" stroke="#94a3b8" stroke-width="1"/>
  <text x="90" y="280" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">PC1</text>
  <line x1="130" y1="275" x2="300" y2="85" stroke="#00d4ff" stroke-width="1"/>

  <rect x="650" y="420" width="80" height="30" rx="4" fill="#1a2332" stroke="#94a3b8" stroke-width="1"/>
  <text x="690" y="440" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">PC2</text>
  <line x1="650" y1="435" x2="500" y2="375" stroke="#7c3aed" stroke-width="1"/>

  <!-- Legend -->
  <rect x="50" y="440" width="300" height="50" rx="6" fill="#1a2332" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="460" font-family="Arial" font-size="11" fill="#00d4ff">VLAN 10 (Sales)</text>
  <text x="70" y="480" font-family="Arial" font-size="11" fill="#7c3aed">VLAN 20 (Engineering)</text>
  <text x="200" y="460" font-family="Arial" font-size="11" fill="#f59e0b">Trunk (802.1Q)</text>
</svg>
