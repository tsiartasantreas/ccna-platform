<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#049a49;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6cc04a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="currentColor" opacity="0.05"/>
  <text x="400" y="40" font-family="Arial" font-size="24" fill="#049a49" text-anchor="middle" font-weight="bold">OSI Model - 7 Layers</text>

  <!-- Layer 7 -->
  <rect x="100" y="60" width="600" height="60" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="1"/>
  <text x="130" y="95" font-family="Arial" font-size="14" fill="#049a49" font-weight="bold">7</text>
  <text x="170" y="95" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Application</text>
  <text x="400" y="95" font-family="Arial" font-size="12" fill="#94a3b8">HTTP, FTP, DNS, SMTP, SSH</text>
  <text x="680" y="95" font-family="Arial" font-size="12" fill="#6cc04a">Data</text>

  <!-- Layer 6 -->
  <rect x="100" y="130" width="600" height="60" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="1"/>
  <text x="130" y="165" font-family="Arial" font-size="14" fill="#049a49" font-weight="bold">6</text>
  <text x="170" y="165" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Presentation</text>
  <text x="400" y="165" font-family="Arial" font-size="12" fill="#94a3b8">SSL/TLS, JPEG, ASCII, MPEG</text>
  <text x="680" y="165" font-family="Arial" font-size="12" fill="#6cc04a">Data</text>

  <!-- Layer 5 -->
  <rect x="100" y="200" width="600" height="60" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="1"/>
  <text x="130" y="235" font-family="Arial" font-size="14" fill="#049a49" font-weight="bold">5</text>
  <text x="170" y="235" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Session</text>
  <text x="400" y="235" font-family="Arial" font-size="12" fill="#94a3b8">NetBIOS, RPC, PPTP</text>
  <text x="680" y="235" font-family="Arial" font-size="12" fill="#6cc04a">Data</text>

  <!-- Layer 4 -->
  <rect x="100" y="270" width="600" height="60" rx="8" fill="#1a2332" stroke="#6cc04a" stroke-width="2"/>
  <text x="130" y="305" font-family="Arial" font-size="14" fill="#6cc04a" font-weight="bold">4</text>
  <text x="170" y="305" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Transport</text>
  <text x="400" y="305" font-family="Arial" font-size="12" fill="#94a3b8">TCP, UDP</text>
  <text x="680" y="305" font-family="Arial" font-size="12" fill="#6cc04a">Segment</text>

  <!-- Layer 3 -->
  <rect x="100" y="340" width="600" height="60" rx="8" fill="#1a2332" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="375" font-family="Arial" font-size="14" fill="#10b981" font-weight="bold">3</text>
  <text x="170" y="375" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Network</text>
  <text x="400" y="375" font-family="Arial" font-size="12" fill="#94a3b8">IP, ICMP, ARP, OSPF</text>
  <text x="680" y="375" font-family="Arial" font-size="12" fill="#10b981">Packet</text>

  <!-- Layer 2 -->
  <rect x="100" y="410" width="600" height="60" rx="8" fill="#1a2332" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="445" font-family="Arial" font-size="14" fill="#f59e0b" font-weight="bold">2</text>
  <text x="170" y="445" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Data Link</text>
  <text x="400" y="445" font-family="Arial" font-size="12" fill="#94a3b8">Ethernet, Wi-Fi, PPP</text>
  <text x="680" y="445" font-family="Arial" font-size="12" fill="#f59e0b">Frame</text>

  <!-- Layer 1 -->
  <rect x="100" y="480" width="600" height="60" rx="8" fill="#1a2332" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="515" font-family="Arial" font-size="14" fill="#ef4444" font-weight="bold">1</text>
  <text x="170" y="515" font-family="Arial" font-size="16" fill="#e2e8f0" font-weight="bold">Physical</text>
  <text x="400" y="515" font-family="Arial" font-size="12" fill="#94a3b8">Cables, Connectors, Hubs</text>
  <text x="680" y="515" font-family="Arial" font-size="12" fill="#ef4444">Bits</text>

  <!-- Mnemonic -->
  <text x="400" y="575" font-family="Arial" font-size="14" fill="#94a3b8" text-anchor="middle">All People Seem To Need Data Processing</text>
</svg>
