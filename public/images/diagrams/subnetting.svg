<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="currentColor" opacity="0.05"/>
  <text x="400" y="30" font-family="Arial" font-size="20" fill="#049a49" text-anchor="middle" font-weight="bold">IPv4 Subnetting - 192.168.1.0/24 into 4 Subnets</text>

  <!-- Main Network -->
  <rect x="50" y="60" width="700" height="50" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="bold">192.168.1.0/24 - 256 addresses</text>

  <!-- Subnet 1 -->
  <rect x="50" y="140" width="160" height="120" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="1"/>
  <text x="130" y="170" font-family="Arial" font-size="12" fill="#049a49" text-anchor="middle" font-weight="bold">Subnet 1</text>
  <text x="130" y="190" font-family="Arial" font-size="11" fill="#e2e8f0" text-anchor="middle">192.168.1.0/26</text>
  <text x="130" y="210" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">.1 - .62</text>
  <text x="130" y="230" font-family="Arial" font-size="10" fill="#10b981" text-anchor="middle">62 hosts</text>

  <!-- Subnet 2 -->
  <rect x="225" y="140" width="160" height="120" rx="8" fill="#1a2332" stroke="#6cc04a" stroke-width="1"/>
  <text x="305" y="170" font-family="Arial" font-size="12" fill="#6cc04a" text-anchor="middle" font-weight="bold">Subnet 2</text>
  <text x="305" y="190" font-family="Arial" font-size="11" fill="#e2e8f0" text-anchor="middle">192.168.1.64/26</text>
  <text x="305" y="210" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">.65 - .126</text>
  <text x="305" y="230" font-family="Arial" font-size="10" fill="#10b981" text-anchor="middle">62 hosts</text>

  <!-- Subnet 3 -->
  <rect x="400" y="140" width="160" height="120" rx="8" fill="#1a2332" stroke="#f59e0b" stroke-width="1"/>
  <text x="480" y="170" font-family="Arial" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">Subnet 3</text>
  <text x="480" y="190" font-family="Arial" font-size="11" fill="#e2e8f0" text-anchor="middle">192.168.1.128/26</text>
  <text x="480" y="210" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">.129 - .190</text>
  <text x="480" y="230" font-family="Arial" font-size="10" fill="#10b981" text-anchor="middle">62 hosts</text>

  <!-- Subnet 4 -->
  <rect x="575" y="140" width="175" height="120" rx="8" fill="#1a2332" stroke="#ef4444" stroke-width="1"/>
  <text x="662" y="170" font-family="Arial" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">Subnet 4</text>
  <text x="662" y="190" font-family="Arial" font-size="11" fill="#e2e8f0" text-anchor="middle">192.168.1.192/26</text>
  <text x="662" y="210" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">.193 - .254</text>
  <text x="662" y="230" font-family="Arial" font-size="10" fill="#10b981" text-anchor="middle">62 hosts</text>

  <!-- Formula -->
  <rect x="100" y="300" width="600" height="80" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="1"/>
  <text x="400" y="330" font-family="Arial" font-size="14" fill="#049a49" text-anchor="middle" font-weight="bold">Subnetting Formula</text>
  <text x="400" y="355" font-family="Arial" font-size="13" fill="#e2e8f0" text-anchor="middle">Subnets = 2^n (n = borrowed bits) | Hosts = 2^h - 2 (h = host bits)</text>
  <text x="400" y="375" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">/26 = 2 borrowed bits = 4 subnets, 6 host bits = 62 hosts each</text>

  <!-- Quick Reference -->
  <rect x="100" y="410" width="600" height="70" rx="8" fill="#1a2332" stroke="#6cc04a" stroke-width="1"/>
  <text x="400" y="435" font-family="Arial" font-size="14" fill="#6cc04a" text-anchor="middle" font-weight="bold">Quick Reference</text>
  <text x="200" y="460" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">/25 = 126 hosts</text>
  <text x="350" y="460" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">/26 = 62 hosts</text>
  <text x="500" y="460" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">/27 = 30 hosts</text>
  <text x="650" y="460" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">/28 = 14 hosts</text>
</svg>
