<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0a0f1e"/>
  <text x="300" y="30" font-family="Arial" font-size="20" fill="#00d4ff" text-anchor="middle" font-weight="bold">TCP Three-Way Handshake</text>

  <!-- Client -->
  <rect x="50" y="60" width="120" height="40" rx="8" fill="#1a2332" stroke="#00d4ff" stroke-width="2"/>
  <text x="110" y="85" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Client</text>

  <!-- Server -->
  <rect x="430" y="60" width="120" height="40" rx="8" fill="#1a2332" stroke="#7c3aed" stroke-width="2"/>
  <text x="490" y="85" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Server</text>

  <!-- SYN -->
  <line x1="170" y1="140" x2="430" y2="180" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-family="Arial" font-size="14" fill="#00d4ff" text-anchor="middle" font-weight="bold">SYN</text>
  <text x="300" y="165" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">seq=x</text>

  <!-- SYN-ACK -->
  <line x1="430" y1="200" x2="170" y2="240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="300" y="215" font-family="Arial" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold">SYN-ACK</text>
  <text x="300" y="230" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">seq=y, ack=x+1</text>

  <!-- ACK -->
  <line x1="170" y1="260" x2="430" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="300" y="275" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">ACK</text>
  <text x="300" y="290" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">ack=y+1</text>

  <!-- Connection Established -->
  <rect x="180" y="330" width="240" height="40" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="300" y="355" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Connection Established</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
</svg>
