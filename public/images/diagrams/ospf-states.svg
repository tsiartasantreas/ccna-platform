<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="currentColor" opacity="0.05"/>
  <text x="400" y="30" font-family="Arial" font-size="20" fill="#049a49" text-anchor="middle" font-weight="bold">OSPF Neighbor States</text>

  <!-- Down -->
  <rect x="30" y="100" width="100" height="50" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="130" font-family="Arial" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">Down</text>

  <!-- Init -->
  <rect x="170" y="100" width="100" height="50" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="130" font-family="Arial" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Init</text>

  <!-- 2-Way -->
  <rect x="310" y="100" width="100" height="50" rx="8" fill="#049a49" fill-opacity="0.2" stroke="#049a49" stroke-width="2"/>
  <text x="360" y="130" font-family="Arial" font-size="14" fill="#049a49" text-anchor="middle" font-weight="bold">2-Way</text>

  <!-- ExStart -->
  <rect x="450" y="100" width="100" height="50" rx="8" fill="#6cc04a" fill-opacity="0.2" stroke="#6cc04a" stroke-width="2"/>
  <text x="500" y="130" font-family="Arial" font-size="14" fill="#6cc04a" text-anchor="middle" font-weight="bold">ExStart</text>

  <!-- Exchange -->
  <rect x="590" y="100" width="100" height="50" rx="8" fill="#6cc04a" fill-opacity="0.2" stroke="#6cc04a" stroke-width="2"/>
  <text x="640" y="130" font-family="Arial" font-size="14" fill="#6cc04a" text-anchor="middle" font-weight="bold">Exchange</text>

  <!-- Loading -->
  <rect x="450" y="250" width="100" height="50" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="280" font-family="Arial" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Loading</text>

  <!-- Full -->
  <rect x="590" y="250" width="100" height="50" rx="8" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="280" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Full</text>

  <!-- Arrows -->
  <line x1="130" y1="125" x2="170" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="125" x2="310" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="125" x2="450" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="125" x2="590" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="150" x2="640" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="275" x2="590" y2="275" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="150" y="115" font-family="Arial" font-size="9" fill="#94a3b8">Hello</text>
  <text x="290" y="115" font-family="Arial" font-size="9" fill="#94a3b8">Hello</text>
  <text x="430" y="115" font-family="Arial" font-size="9" fill="#94a3b8">DBD</text>
  <text x="570" y="115" font-family="Arial" font-size="9" fill="#94a3b8">DBD</text>
  <text x="650" y="210" font-family="Arial" font-size="9" fill="#94a3b8">LSR</text>
  <text x="570" y="265" font-family="Arial" font-size="9" fill="#94a3b8">LSU</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
