<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="currentColor" opacity="0.05"/>
  <text x="350" y="30" font-family="Arial" font-size="20" fill="#049a49" text-anchor="middle" font-weight="bold">DHCP DORA Process</text>

  <!-- Client -->
  <rect x="80" y="80" width="120" height="40" rx="8" fill="#1a2332" stroke="#049a49" stroke-width="2"/>
  <text x="140" y="105" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Client</text>

  <!-- Server -->
  <rect x="500" y="80" width="120" height="40" rx="8" fill="#1a2332" stroke="#6cc04a" stroke-width="2"/>
  <text x="560" y="105" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">DHCP Server</text>

  <!-- Discover -->
  <line x1="200" y1="150" x2="500" y2="180" stroke="#049a49" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="140" width="140" height="25" rx="4" fill="#049a49" fill-opacity="0.2"/>
  <text x="350" y="158" font-family="Arial" font-size="12" fill="#049a49" text-anchor="middle" font-weight="bold">1. DISCOVER</text>
  <text x="350" y="185" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">Broadcast: "I need an IP"</text>

  <!-- Offer -->
  <line x1="500" y1="200" x2="200" y2="230" stroke="#6cc04a" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="280" y="200" width="140" height="25" rx="4" fill="#6cc04a" fill-opacity="0.2"/>
  <text x="350" y="218" font-family="Arial" font-size="12" fill="#6cc04a" text-anchor="middle" font-weight="bold">2. OFFER</text>
  <text x="350" y="245" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">"Here's 192.168.1.100"</text>

  <!-- Request -->
  <line x1="200" y1="260" x2="500" y2="290" stroke="#10b981" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="280" y="260" width="140" height="25" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="350" y="278" font-family="Arial" font-size="12" fill="#10b981" text-anchor="middle" font-weight="bold">3. REQUEST</text>
  <text x="350" y="305" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">"I'll take that IP"</text>

  <!-- Acknowledge -->
  <line x1="500" y1="310" x2="200" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="280" y="310" width="140" height="25" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="350" y="328" font-family="Arial" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">4. ACKNOWLEDGE</text>
  <text x="350" y="355" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">"It's yours for 24h"</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#049a49"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6cc04a"/></marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/></marker>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/></marker>
  </defs>
</svg>
