<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <rect width="700" height="500" fill="currentColor" opacity="0.05"/>
  <text x="350" y="30" font-family="Arial" font-size="20" fill="#049a49" text-anchor="middle" font-weight="bold">Spanning Tree Protocol (STP)</text>

  <!-- Root Bridge -->
  <rect x="250" y="60" width="200" height="60" rx="10" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="85" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Root Bridge</text>
  <text x="350" y="105" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">Switch A (Priority: 4096)</text>

  <!-- Switch B -->
  <rect x="80" y="250" width="160" height="60" rx="10" fill="#1a2332" stroke="#049a49" stroke-width="2"/>
  <text x="160" y="275" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Switch B</text>
  <text x="160" y="295" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">Root Port (RP)</text>

  <!-- Switch C -->
  <rect x="460" y="250" width="160" height="60" rx="10" fill="#1a2332" stroke="#049a49" stroke-width="2"/>
  <text x="540" y="275" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Switch C</text>
  <text x="540" y="295" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">Root Port (RP)</text>

  <!-- Switch D -->
  <rect x="270" y="400" width="160" height="60" rx="10" fill="#1a2332" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="425" font-family="Arial" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Switch D</text>
  <text x="350" y="445" font-family="Arial" font-size="11" fill="#ef4444" text-anchor="middle">Blocked Port</text>

  <!-- Links -->
  <line x1="300" y1="120" x2="160" y2="250" stroke="#10b981" stroke-width="2"/>
  <text x="210" y="180" font-family="Arial" font-size="10" fill="#10b981">DP</text>

  <line x1="400" y1="120" x2="540" y2="250" stroke="#10b981" stroke-width="2"/>
  <text x="490" y="180" font-family="Arial" font-size="10" fill="#10b981">DP</text>

  <line x1="160" y1="310" x2="350" y2="400" stroke="#049a49" stroke-width="2"/>
  <text x="240" y="360" font-family="Arial" font-size="10" fill="#049a49">DP</text>

  <line x1="540" y1="310" x2="350" y2="400" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="460" y="360" font-family="Arial" font-size="10" fill="#ef4444">Blocked</text>

  <!-- Legend -->
  <rect x="20" y="440" width="200" height="50" rx="6" fill="#1a2332" stroke="#94a3b8" stroke-width="1"/>
  <text x="30" y="460" font-family="Arial" font-size="10" fill="#10b981">RP = Root Port</text>
  <text x="30" y="480" font-family="Arial" font-size="10" fill="#049a49">DP = Designated Port</text>
</svg>
