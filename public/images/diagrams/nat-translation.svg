<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="currentColor" opacity="0.05"/>
  <text x="400" y="30" font-family="Arial" font-size="20" fill="#049a49" text-anchor="middle" font-weight="bold">NAT Translation</text>

  <!-- Inside Network -->
  <rect x="30" y="60" width="250" height="300" rx="10" fill="#1a2332" stroke="#049a49" stroke-width="1"/>
  <text x="155" y="85" font-family="Arial" font-size="14" fill="#049a49" text-anchor="middle" font-weight="bold">Inside Network</text>

  <!-- Router -->
  <rect x="330" y="150" width="140" height="100" rx="10" fill="#6cc04a" fill-opacity="0.2" stroke="#6cc04a" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial" font-size="14" fill="#6cc04a" text-anchor="middle" font-weight="bold">Router</text>
  <text x="400" y="215" font-family="Arial" font-size="11" fill="#94a3b8" text-anchor="middle">NAT Table</text>

  <!-- Outside Network -->
  <rect x="520" y="60" width="250" height="300" rx="10" fill="#1a2332" stroke="#10b981" stroke-width="1"/>
  <text x="645" y="85" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">Outside Network</text>

  <!-- Inside PCs -->
  <rect x="60" y="120" width="100" height="30" rx="4" fill="#049a49" fill-opacity="0.2" stroke="#049a49" stroke-width="1"/>
  <text x="110" y="140" font-family="Arial" font-size="10" fill="#049a49" text-anchor="middle">PC1: 10.0.0.1</text>

  <rect x="60" y="170" width="100" height="30" rx="4" fill="#049a49" fill-opacity="0.2" stroke="#049a49" stroke-width="1"/>
  <text x="110" y="190" font-family="Arial" font-size="10" fill="#049a49" text-anchor="middle">PC2: 10.0.0.2</text>

  <rect x="60" y="220" width="100" height="30" rx="4" fill="#049a49" fill-opacity="0.2" stroke="#049a49" stroke-width="1"/>
  <text x="110" y="240" font-family="Arial" font-size="10" fill="#049a49" text-anchor="middle">PC3: 10.0.0.3</text>

  <!-- Outside Server -->
  <rect x="580" y="180" width="130" height="40" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="645" y="205" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">Web Server</text>
  <text x="645" y="220" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">203.0.113.50</text>

  <!-- NAT Table -->
  <rect x="340" y="270" width="120" height="80" rx="4" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="290" font-family="Arial" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">NAT Table</text>
  <text x="400" y="310" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">10.0.0.1 → 203.0.113.1</text>
  <text x="400" y="325" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">10.0.0.2 → 203.0.113.2</text>
  <text x="400" y="340" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">10.0.0.3 → 203.0.113.3</text>

  <!-- Labels -->
  <text x="155" y="300" font-family="Arial" font-size="11" fill="#049a49" text-anchor="middle">Private IPs</text>
  <text x="645" y="300" font-family="Arial" font-size="11" fill="#10b981" text-anchor="middle">Public IPs</text>
</svg>
